<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Weekly Report{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/app.css">
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="/">週報システム</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="/members">メンバー</a></li>
          <li class="nav-item"><a class="nav-link" href="/reports">レポート</a></li>
          <li class="nav-item"><a class="nav-link" href="/weekly-report">週報提出</a></li>
          {% if user and user.role == 'admin' %}
          <li class="nav-item"><a class="nav-link" href="/admin/schedules">スケジュール</a></li>
          {% endif %}
        </ul>
        <ul class="navbar-nav ms-auto">
          {% if user %}
          <li class="nav-item">
            <span class="navbar-text text-light me-3">{{ user.name }}</span>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/auth/logout">ログアウト</a>
          </li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>

  <div class="container-fluid mt-3">
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
