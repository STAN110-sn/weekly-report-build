{% extends "base.html" %}
{% block title %}週報提出{% endblock %}

{% block content %}
<div class="row g-3">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-header fw-bold">週報を提出する</div>
      <div class="card-body">
        <div id="formAlert"></div>
        <div class="mb-3">
          <label class="form-label">今週の作業内容 <span class="text-danger">*</span></label>
          <textarea class="form-control" id="workContent" rows="5" placeholder="今週取り組んだ業務・成果を記入してください"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">来週の作業予定 <span class="text-danger">*</span></label>
          <textarea class="form-control" id="nextWeekPlan" rows="4" placeholder="来週予定している業務を記入してください"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">会社への要望・意見</label>
          <textarea class="form-control" id="requestsOpinions" rows="3" placeholder="任意：要望・意見・困っていることなど"></textarea>
        </div>
        <button class="btn btn-primary w-100" onclick="submitReport()" id="submitBtn">提出する</button>
      </div>
    </div>
  </div>
  <div class="col-lg-6">
    <h6 class="fw-bold mb-2">提出履歴</h6>
    <div id="historyList">
      <p class="text-muted small">読み込み中...</p>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/weekly_report.js"></script>
{% endblock %}
